<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsDraft }}Публикация рейса{{ else }}Создание рейса{{ end }}</title>
    <link rel="stylesheet" href="/static/styles/create_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="page">
        <div id="content">

            {{ if .IsDraft }}
            <form method="POST" action="/planet_pairs/publish" class="create-form">

                <div class="media-section">
                    <div class="media-item">
                        <div class="preview-box preview-photo">
                            <img src="{{ .PhotoURL }}" alt="Фото">
                        </div>
                    </div>

                    <div class="media-item">
                        <div class="preview-box preview-video">
                            <video src="{{ .VideoURL }}" autoplay muted loop playsinline></video>
                        </div>
                    </div>
                </div>

                <div class="fields-section">
                    <div class="field-group">
                        <span class="field-label">Расстояние:</span>
                        <input class="field-value" type="number" name="Distance"
                               value="{{ .PlanetPair.Distance }}" placeholder="0">
                    </div>

                    <div class="field-group">
                        <span class="field-label">Период сближения:</span>
                        <input class="field-value" type="number" name="Period"
                               value="{{ .PlanetPair.Period }}" placeholder="0">
                    </div>

                    <div class="field-group textarea-group">
                        <span class="field-label">Доп. информация:</span>
                        <textarea class="field-value textarea-value" name="Description"
                                  rows="3" placeholder="Введите дополнительную информацию...">{{ .PlanetPair.Description }}</textarea>
                    </div>

                    <button type="submit" class="submit-btn">Опубликовать</button>

                    {{ if .Errors }}
                    <div class="error-message">
                        {{ range .Errors }}
                        <div>{{ . }}</div>
                        {{ end }}
                    </div>
                    {{ end }}
                </div>

            </form>

            {{ else }}
            <form method="POST" action="/planet_pairs/create" enctype="multipart/form-data" class="create-form">

                <div class="fields-section-top">
                    <div class="field-group">
                        <span class="field-label">Планета-отправитель:</span>
                        <input class="field-value" type="text" name="PlanetStart"
                               value="{{ .FormPlanetStart }}" placeholder="Введите название">
                    </div>

                    <div class="field-group">
                        <span class="field-label">Планета-получатель:</span>
                        <input class="field-value" type="text" name="PlanetEnd"
                               value="{{ .FormPlanetEnd }}" placeholder="Введите название">
                    </div>
                </div>

                <div class="media-section">
                    <div class="media-item">
                        <div class="media-header">
                            <span class="file-label">Фото:</span>
                            <input class="file-input" type="file" name="photo" accept="image/*">
                        </div>
                        <div class="preview-box preview-photo">
                            <span class="preview-text">Фото</span>
                        </div>
                    </div>

                    <div class="media-item">
                        <div class="media-header">
                            <span class="file-label">Видео:</span>
                            <input class="file-input" type="file" name="video" accept="video/*">
                        </div>
                        <div class="preview-box preview-video">
                            <span class="preview-text">Видео</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Далее</button>

                {{ if .Errors }}
                <div class="error-message">
                    {{ range .Errors }}
                    <div>{{ . }}</div>
                    {{ end }}
                </div>
                {{ end }}

            </form>
            {{ end }}

        </div>

        <div id="bottom-bar">
            <div class="nav-btn"><a href="/planet_pairs/1"><img src="/static/img/Icon-home.png"></a></div>
            <div class="nav-btn active"><img src="/static/img/Icon-plus.png"></div>
            <div class="nav-btn"><a href="/planet_pairs"><img src="/static/img/Icon-plates.png"></a></div>
        </div>
    </div>
</body>
</html>
